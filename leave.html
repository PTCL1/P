<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Leave | PTCL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #e0e5ec; --text: #444; --green-accent: #27ae60; --shadow-dark: #a3b1c6; --shadow-light: #ffffff; --danger: #e74c3c; }
    * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { width: min(500px, 100%); background: var(--bg); border-radius: 40px; padding: 40px 30px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); text-align: center; }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #222; text-transform: uppercase; border-bottom: 3px solid var(--green-accent); display: inline-block; padding-bottom: 5px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #777; margin-left: 15px; margin-bottom: 6px; text-transform: uppercase; }
    input, textarea, select { width: 100%; padding: 14px 20px; background: var(--bg); border: none; border-radius: 15px; outline: none; color: #444; font-weight: 600; font-size: 14px; box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); }
    input:read-only { background: #dce1e9; color: #666; cursor: not-allowed; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    .btn-group { display: flex; gap: 15px; margin-top: 25px; }
    button { flex: 1; padding: 15px; border-radius: 15px; border: none; background: var(--bg); font-weight: 800; cursor: pointer; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); text-transform: uppercase; }
    #submitBtn { color: var(--green-accent); }
    button:active { transform: scale(0.95); }
    .status { margin-top: 20px; font-size: 13px; font-weight: 700; display: none; padding: 10px; border-radius: 10px; }
    .status.success { color: var(--green-accent); display: block; }
    .status.error { color: var(--danger); display: block; }
    .status.info { color: #2980b9; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Apply Leave</h2>
    <form id="leaveForm">
      <div class="row">
        <div class="form-group">
          <label>Employee Name</label>
          <input type="text" id="Name" readonly>
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="Department" readonly>
        </div>
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" id="EmpID" readonly>
      </div>
      <div class="row">
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="FromDate" required>
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="ToDate" required>
        </div>
      </div>
      <div class="form-group">
        <label>Leave Type</label>
        <select id="Type" required>
          <option value="" disabled selected>Select Leave Type</option>
          <option value="Short Leave">Short Leave</option>
          <option value="Half Day">Half Day</option>
          <option value="Full Day">Full Day</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reason</label>
        <textarea id="Reason" placeholder="Explain your reason..." required></textarea>
      </div>
      <div class="btn-group">
        <button id="submitBtn" type="button" onclick="submitLeaveData()">Submit Request</button>
        <button type="button" onclick="window.history.back()">Back</button>
      </div>
    </form>
    <div class="status" id="statusMsg"></div>
  </div>

  <script src="app.js"></script>

  <script>
    window.onload = function () {
      // 1. Date setting
      const today = new Date().toISOString().split("T")[0];
      const fromInp = document.getElementById("FromDate");
      const toInp = document.getElementById("ToDate");
      
      fromInp.value = today;
      fromInp.min = today;
      toInp.value = today;
      toInp.min = today;

      // 2. LocalStorage se data load karna (Keys match with app.js)
      document.getElementById("Name").value = localStorage.getItem('ep_name') || 'Loading...';
      document.getElementById("Department").value = localStorage.getItem('ep_dept') || 'Loading...';
      document.getElementById("EmpID").value = localStorage.getItem('ep_id') || 'Loading...';

      // 3. Data verify karna via app.js function
      if (typeof fetchMe === "function") {
        fetchMe().then(d => {
          if (d && d.profile) {
            document.getElementById("Name").value = d.profile.Name;
            document.getElementById("Department").value = d.profile.Department;
            document.getElementById("EmpID").value = d.profile.EmpID;
            // Backup save to localstorage
            localStorage.setItem('ep_dept', d.profile.Department);
            localStorage.setItem('ep_id', d.profile.EmpID);
          }
        }).catch(err => console.log("Profile sync failed:", err.message));
      }
    };

    async function submitLeaveData() {
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      // Fields validation
      const type = document.getElementById("Type").value;
      const reason = document.getElementById("Reason").value.trim();
      const empId = document.getElementById("EmpID").value;

      if (!type || !reason || empId === "Loading...") {
        statusMsg.textContent = "Error: Please fill all fields and wait for profile to load!";
        statusMsg.className = "status error";
        return;
      }

      // Payload taiyar karna (app.js ke applyLeave ko token nahi bhejte, wo khud nikalta hai)
      const payload = {
        fromDate: document.getElementById("FromDate").value,
        toDate: document.getElementById("ToDate").value,
        type: type,
        reason: reason,
        name: document.getElementById("Name").value,
        department: document.getElementById("Department").value
      };

      btn.disabled = true;
      statusMsg.textContent = "Submitting to PTCL Server...";
      statusMsg.className = "status info";

      try {
        // App.js ka applyLeave call karein
        const response = await applyLeave(payload); 
        
        // Agar yahan tak aa gaya, matlab response.ok true tha
        statusMsg.textContent = "Success! Your leave request is PENDING.";
        statusMsg.className = "status success";
        document.getElementById("leaveForm").reset();
        
        // Refresh values
        setTimeout(() => {
          window.onload();
          statusMsg.style.display = "none";
        }, 3000);

      } catch (err) {
        statusMsg.textContent = "Failed: " + err.message;
        statusMsg.className = "status error";
        
        // Agar token missing ka error hai toh login par bhej sakte hain
        if (err.message.includes("token")) {
           statusMsg.textContent = "Session Expired! Please Login again.";
        }
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
