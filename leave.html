<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Application | PTCL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #e0e5ec; 
      --text: #333; 
      --green-accent: #27ae60; 
      --shadow-dark: #a3b1c6;
      --shadow-light: #ffffff;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
    
    body { 
      margin: 0; background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }

    .container { 
      width: min(500px, 100%); background: var(--bg); border-radius: 40px; 
      padding: 40px 30px; box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
      text-align: center;
    }

    h2 { 
      font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #222; 
      text-transform: uppercase; border-bottom: 3px solid var(--green-accent);
      display: inline-block; padding-bottom: 5px;
    }

    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #777; margin-left: 15px; margin-bottom: 6px; text-transform: uppercase; }

    input, textarea, select { 
      width: 100%; padding: 14px 20px; background: var(--bg); border: none; border-radius: 15px; 
      outline: none; color: #444; font-weight: 600; font-size: 14px;
      box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    }

    input:read-only { background: #dce1e9; color: #666; cursor: not-allowed; }

    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }

    .btn-group { display: flex; gap: 15px; margin-top: 25px; }
    button { 
      flex: 1; padding: 15px; border-radius: 15px; border: none; background: var(--bg);
      font-weight: 800; cursor: pointer; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      text-transform: uppercase;
    }

    #submitBtn { color: var(--green-accent); }
    button:active { transform: scale(0.98); box-shadow: inset 4px 4px 8px var(--shadow-dark); }

    .status { margin-top: 20px; font-size: 13px; font-weight: 700; display: none; padding: 10px; border-radius: 10px; }
    .status.success { color: var(--green-accent); display: block; }
    .status.error { color: var(--danger); display: block; }
    .status.info { color: #555; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Apply Leave</h2>

    <form id="leaveForm">
      <div class="row">
        <div class="form-group">
          <label>Employee Name</label>
          <input type="text" id="Name" readonly>
        </div>
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="Department" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" id="EmpID" readonly>
      </div>

      <div class="row">
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="FromDate" required>
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="ToDate" required>
        </div>
      </div>

      <div class="form-group">
        <label>Leave Type</label>
        <select id="Type" required>
          <option value="" disabled selected>Select Leave Type</option>
          <option value="Sort Leave">Sort Leave</option>
          <option value="Half Day">Half Day</option>
          <option value="Full Day">Full Day</option>
        </select>
      </div>

      <div class="form-group">
        <label>Reason</label>
        <textarea id="Reason" placeholder="Explain your reason..." required></textarea>
      </div>

      <div class="btn-group">
        <button id="submitBtn" type="button" onclick="submitLeaveData()">Submit Request</button>
        <button type="button" onclick="window.history.back()">Back</button>
      </div>
    </form>

    <div class="status" id="statusMsg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // Page load hote hi data auto-fill aur back-date block karne ke liye
    window.onload = function () {
      const today = new Date().toISOString().split("T")[0];
      
      const fromInp = document.getElementById("FromDate");
      const toInp = document.getElementById("ToDate");
      
      if(fromInp) { fromInp.min = today; fromInp.value = today; }
      if(toInp) { toInp.min = today; toInp.value = today; }

      // LocalStorage se data uthana
      // Note: Login script mein 'ep_name', 'ep_dept', 'ep_id' isi naam se save hona chahiye
      document.getElementById("Name").value = localStorage.getItem('ep_name') || 'No Name';
      document.getElementById("Department").value = localStorage.getItem('ep_dept') || 'N/A';
      document.getElementById("EmpID").value = localStorage.getItem('ep_id') || 'Not Set';

      if (!localStorage.getItem('ep_name')) {
        alert("Session expired. Please login again.");
        window.location.href = 'index.html';
      }
    };

    async function submitLeaveData() {
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      // Sheet columns sequence: Timestamp, EmpID, FromDate, ToDate, Type, Reason, Status, Name, Department
      const leaveData = {
        Timestamp: new Date().toLocaleString(),
        EmpID: document.getElementById("EmpID").value,
        FromDate: document.getElementById("FromDate").value,
        ToDate: document.getElementById("ToDate").value,
        Type: document.getElementById("Type").value,
        Reason: document.getElementById("Reason").value.trim(),
        Status: "Pending",
        Name: document.getElementById("Name").value,
        Department: document.getElementById("Department").value
      };

      // Basic validation
      if(!leaveData.Type || !leaveData.Reason || leaveData.EmpID === "Not Set") {
        statusMsg.textContent = "Error: Please fill all fields or re-login!";
        statusMsg.className = "status error";
        statusMsg.style.display = "block";
        return;
      }

      btn.disabled = true;
      statusMsg.className = "status info";
      statusMsg.textContent = "Sending request to Leave_Requests...";
      statusMsg.style.display = "block";

      try {
        // Yeh function app.js mein define hona chahiye jo Google Apps Script ko data bheje
        await applyLeave(leaveData); 

        statusMsg.textContent = "Leave request submitted successfully!";
        statusMsg.className = "status success";
        document.getElementById("leaveForm").reset();
        
        // Form reset hone ke baad auto-fields ko phir se fill karna
        document.getElementById("Name").value = localStorage.getItem('ep_name');
        document.getElementById("Department").value = localStorage.getItem('ep_dept');
        document.getElementById("EmpID").value = localStorage.getItem('ep_id');
        document.getElementById("FromDate").value = new Date().toISOString().split("T")[0];
        document.getElementById("ToDate").value = new Date().toISOString().split("T")[0];

      } catch (err) {
        statusMsg.textContent = "Error: " + (err.message || "Failed to submit");
        statusMsg.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
