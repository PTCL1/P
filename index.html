<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCL Employee Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #e0e5ec; 
    --text: #333; 
    --red-accent: #e74c3c; /* Logo wala Red */
    --shadow-dark: #a3b1c6;
    --shadow-light: #ffffff;
    --danger: #e74c3c;
  }

  * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
  
  body { 
    margin: 0; 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Inter', sans-serif; 
    min-height: 100vh;
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }

  /* Neumorphic Card */
  .card { 
    width: min(420px, 92vw); 
    background: var(--bg); 
    border-radius: 40px; 
    padding: 40px 30px; 
    box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
    text-align: center;
  }

  /* Logo Styling (Adjusted for your 3D Logo) */
  .logo-container {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 50%;
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    padding: 10px;
  }
  .logo-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  h1 { font-size: 22px; font-weight: 800; margin-bottom: 30px; color: #222; text-transform: uppercase; letter-spacing: 1px; }

  .input-group { text-align: left; margin-bottom: 20px; }
  
  label { 
    display: block; 
    font-size: 12px; 
    font-weight: 800; 
    color: #777; 
    margin-left: 15px; 
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  /* Neumorphic Inputs */
  input { 
    width: 100%; 
    padding: 16px 20px; 
    background: var(--bg); 
    border: none; 
    border-radius: 20px; 
    outline: none; 
    color: #444;
    font-weight: 600;
    font-size: 14px;
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
  }

  input:focus {
    box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
    border-left: 3px solid var(--red-accent); /* Subtle Red accent on focus */
  }

  /* Login Button (Red/Black Accented) */
  button { 
    width: 100%; 
    padding: 16px; 
    border-radius: 20px; 
    border: none;
    background: var(--bg);
    color: var(--red-accent); /* Use Red for text/brand feel */
    font-weight: 800; 
    font-size: 16px; 
    margin-top: 20px; 
    cursor: pointer; 
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  button:hover {
    color: #222; /* Darker on hover like the black in your logo */
  }

  button:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    transform: scale(0.98);
  }

  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .error { 
    color: var(--danger); 
    margin-top: 15px; 
    font-size: 13px; 
    font-weight: 700;
    min-height: 1.2em; 
  }

  .foot { 
    margin-top: 40px; 
    color: #999; 
    font-size: 10px; 
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img src="wmremove-transformed.jpg" alt="PTCL Logo">
  </div>
  <h1>Employee Portal</h1>
  
  <div class="input-group">
    <label>Employee ID</label>
    <input id="empId" placeholder="E.G. PS0052" autocomplete="username">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button id="loginBtn">Login</button>
  <div class="error" id="msg"></div>
  
  <div class="foot">DESIGNED BY VINAY MAAN</div>
</div>

<script src="app.js"></script>
<script>
  const empInput = document.getElementById('empId');
  const passInput = document.getElementById('password');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  function setLoading(v){ 
    btn.disabled = v; 
    btn.textContent = v ? 'Verifying...' : 'Login'; 
  }

  btn.addEventListener('click', async () => {
    msg.textContent = '';
    const empId = empInput.value.trim();
    const password = passInput.value;
    
    if (!empId || !password) { 
      msg.textContent = 'Please enter ID and Password'; 
      return; 
    }

    try {
      setLoading(true);
      await login(empId, password);
      window.location.href = 'dashboard.html';
    } catch(e) {
      msg.textContent = e.message || 'Login failed';
    } finally {
      setLoading(false);
    }
  });

  document.addEventListener('keydown', e => { 
    if (e.key === 'Enter') btn.click(); 
  });
</script>
</body>
</html>
