<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCL | Employee Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #111315; /* Logo Black */
    --card-bg: #1a1d20; 
    --text: #eaeaea; 
    --danger: #e74c3c; /* Logo Red */
    --shadow-red: rgba(231, 76, 60, 0.4);
  }

  * { box-sizing: border-box; transition: all 0.2s ease; }
  
  body { 
    margin: 0; 
    background: radial-gradient(circle at 10% 90%, rgba(231,76,60,0.1) 0%, transparent 60%), var(--bg);
    color: var(--text); 
    font-family: 'Poppins', sans-serif; 
    min-height: 100vh;
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }

  /* Premium Glowing Card */
  .card { 
    width: min(420px, 92vw); 
    background: var(--card-bg); 
    border-radius: 20px; 
    padding: 40px 30px; 
    border: 1px solid rgba(231, 76, 60, 0.2);
    box-shadow: 0 0 30px rgba(0,0,0,0.6), 0 0 15px var(--shadow-red);
    text-align: center;
  }

  /* Logo Image (Using your provided logo) */
  .logo-img { 
    width: 160px; height: 160px; object-fit: contain; margin: 0 auto 10px;
  }

  h1 { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #fff; text-shadow: 0 0 10px var(--danger); }

  .input-group { text-align: left; margin-bottom: 20px; }
  
  label { display: block; font-size: 13px; font-weight: 600; color: #aaa; margin-left: 5px; margin-bottom: 8px; }

  /* Premium Inputs */
  input { 
    width: 100%; padding: 15px; 
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
    outline: none; color: #fff; font-weight: 500; font-size: 14px;
  }

  input:focus {
    border-color: var(--danger); box-shadow: 0 0 10px var(--shadow-red);
  }

  /* Logo-Match Premium Button (Glow Effect) */
  button { 
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #000 0%, #333 100%);
    color: #fff; font-weight: 800; font-size: 16px; margin-top: 15px; cursor: pointer; 
    box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
  }

  /* Hover glow effect */
  button:hover {
    box-shadow: 0 0 20px var(--shadow-red);
    background: linear-gradient(135deg, #111 0%, #444 100%);
  }

  button:active {
    transform: translateY(2px); box-shadow: 0 0 10px var(--shadow-red);
  }

  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .error { color: var(--danger); margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 1.2em; text-shadow: 0 0 5px var(--danger); }
  .foot { margin-top: 30px; color: #666; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="card">
  <img src="logo.png" alt="PTCL Logo" class="logo-img">
  <h1>Portal Login</h1>
  
  <div class="input-group">
    <label>Employee ID</label>
    <input id="empId" placeholder="e.g. E65" autocomplete="username">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button id="loginBtn">VERIFY & LOGIN</button>
  <div class="error" id="msg"></div>
  
  <div class="foot">DESIGNED BY VINAY MAAN</div>
</div>

<script src="app.js"></script>
<script>
  // ... (Your original JS logic here) ...
</script>
</body>
</html>
