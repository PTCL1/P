<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTCL | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #0d0d0d; 
    --card-bg: #111111; 
    --text: #f0f0f0; 
    --accent: #e74c3c; /* Logo Red */
  }

  * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
  
  body { 
    margin: 0; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; 
    min-height: 100vh; display: flex; align-items: center; justify-content: center; 
  }

  /* Sleek Minimalist Card */
  .card { 
    width: min(420px, 92vw); background: var(--card-bg); border-radius: 12px; padding: 40px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
  }

  /* Logo with Minimal border */
  .logo-box { 
    width: 140px; height: 140px; margin: 0 auto 20px;
    background: transparent; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    border-bottom: 4px solid var(--accent);
  }
  .logo-box img { width: 120px; height: 120px; object-fit: contain; }

  h1 { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 35px; color: #fff; }

  .input-group { text-align: left; margin-bottom: 25px; }
  
  label { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 10px; }

  /* Minimal Inputs */
  input { 
    width: 100%; padding: 18px 20px; 
    background: transparent; border: 2px solid #222; border-radius: 8px; 
    outline: none; color: #fff; font-weight: 600; font-size: 14px;
  }

  input:focus {
    border-color: var(--accent);
  }

  /* Black Tech Button */
  button { 
    width: 100%; padding: 18px; border-radius: 8px; border: 2px solid #333;
    background: #111;
    color: #fff; font-weight: 800; font-size: 15px; margin-top: 15px; cursor: pointer; 
    letter-spacing: 1px;
  }

  button:hover {
    background: #000; border-color: #444; box-shadow: 0 0 10px rgba(255,255,255,0.1);
  }

  button:active {
    background: #222; border-color: #555; transform: scale(0.98);
  }

  .error { color: var(--accent); margin-top: 15px; font-size: 12px; font-weight: 600; min-height: 1.2em; text-transform: uppercase; letter-spacing: 0.5px;}
  .foot { margin-top: 40px; color: #444; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-box">
    <img src="logo.png" alt="Logo">
  </div>
  <h1>SIGN IN</h1>
  
  <div class="input-group">
    <label>EMP ID</label>
    <input id="empId" placeholder="E001" autocomplete="username">
  </div>

  <div class="input-group">
    <label>PASSWORD</label>
    <input id="password" type="password" placeholder="••••" autocomplete="current-password">
  </div>

  <button id="loginBtn">PROCEED</button>
  <div class="error" id="msg"></div>
  
  <div class="foot">© VINAY MAAN</div>
</div>

<script src="app.js"></script>
<script>
  // ... (Your original JS logic here) ...
</script>
</body>
</html>
