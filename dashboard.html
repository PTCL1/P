<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root { 
    --bg:#e0e5ec; /* Light gray background for Neumorphism */
    --card:#e0e5ec; 
    --text:#444; 
    --muted:#777; 
    --yellow:#ffd400; 
    --shadow-dark: #a3b1c6;
    --shadow-light: #ffffff;
  }
  
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
  
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:60px;height:60px;border-radius:50%;
    background:var(--bg);
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    display:flex;align-items:center;justify-content:center;color:var(--yellow);font-weight:800;font-size:20px;
  }
  
  .logout{
    background:#ff6b6b;border:none;color:#fff;padding:10px 20px;border-radius:12px;
    box-shadow: 4px 4px 10px #c0c0c0; cursor:pointer;font-weight:700;
  }

  .grid{display:grid;grid-template-columns: 1fr 1fr; gap:25px;}
  
  /* Neumorphic Card Style */
  .card {
    background: var(--bg);
    border-radius: 24px;
    padding: 25px;
    box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
  }

  .hello{font-size:24px;font-weight:800;margin-bottom:20px; color:#333;}
  
  /* Button Grid Styling */
  .btns {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 20px;
  }

  /* Neumorphic Buttons */
  .btn {
    background: var(--bg);
    border: none;
    border-radius: 15px;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #555;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    transition: 0.2s ease;
  }

  .btn i {
    font-size: 24px;
    color: var(--yellow); /* Icon color matching your theme */
  }

  .btn:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    transform: scale(0.98);
  }

  /* Special style for primary action */
  .btn.primary i { color: #ff9f43; }

  .photo img {
    width: 140px; height: 140px; border-radius: 50%;
    border: 5px solid var(--bg);
    box-shadow: 8px 8px 15px var(--shadow-dark), -8px -8px 15px var(--shadow-light);
    margin-bottom: 20px;
  }

  .kv { border-bottom: 1px solid rgba(0,0,0,0.05); padding: 12px 0; font-size: 14px; }
  .kv b { color: #222; }
  
  .tbl { width: 100%; border-collapse: collapse; margin-top: 15px; background: #f8f9fa; border-radius: 10px; overflow: hidden; }
  .tbl th { background: #eee; padding: 12px; font-size: 12px; }
  .tbl td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }

  @media (max-width: 890px) { .grid { grid-template-columns: 1fr; } .btns { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">PTCL</div>
      <div class="title" style="font-weight: 800;">Portal</div>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="photo" style="text-align: center;">
        <img id="photo" src="" alt="User">
      </div>
      <div id="details"></div>
    </div>

    <div class="card">
      <div class="hello" id="hello">Welcome</div>
      <div class="btns">
        <div class="btn" onclick="openSection('leave-balance')">
          <i class="fas fa-wallet"></i>
          <span>Leave Balance</span>
        </div>
        <div class="btn" onclick="openSection('attendance')">
          <i class="fas fa-user-check"></i>
          <span>Attendance</span>
        </div>
        <div class="btn" onclick="openSection('salary')">
          <i class="fas fa-file-invoice-dollar"></i>
          <span>Salary Slip</span>
        </div>
        <div class="btn" onclick="openSection('documents')">
          <i class="fas fa-folder-open"></i>
          <span>Documents</span>
        </div>
        <div class="btn" onclick="openSection('complaints')">
          <i class="fas fa-exclamation-circle"></i>
          <span>Status</span>
        </div>
        <div class="btn" onclick="window.location.href='COM.HTML'">
          <i class="fas fa-edit"></i>
          <span>Complaint</span>
        </div>
        <div class="btn" onclick="showLeaveModal()">
          <i class="fas fa-paper-plane"></i>
          <span>Leave Apply</span>
        </div>
        <div class="btn" onclick="openSection('holidays')">
          <i class="fas fa-umbrella-beach"></i>
          <span>Holidays</span>
        </div>
      </div>
      
      <div id="sectionCard" style="margin-top:30px; border-top:2px solid #d1d9e6; padding-top:20px;">
        <div id="sectionTitle" style="font-weight:bold; color:var(--yellow); margin-bottom:10px;">Details</div>
        <div id="sectionBody" class="muted" style="font-size:13px;">Select an option above</div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  // ... (Your existing JS functions: openSection, init, etc. go here) ...
  // Make sure to keep your existing init() and fetch functions below.
</script>
</body>
</html>
