<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Dashboard | PTCL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  :root { 
    --bg: #e0e5ec; 
    --text: #333; 
    --yellow: #ffcc00; 
    --shadow-dark: #a3b1c6;
    --shadow-light: #ffffff;
  }
  
  * { box-sizing: border-box; transition: all 0.3s ease; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
  
  .wrap { max-width: 1100px; margin: 0 auto; padding: 15px; }

  /* Main Layout Grid */
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 25px; align-items: start; margin-top: 20px; }

  /* Neumorphic Card Base */
  .card {
    background: var(--bg); border-radius: 40px; padding: 30px;
    box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
    text-align: center; margin-bottom: 25px;
  }

  /* Large Profile Image */
  .photo-container {
    width: 240px; height: 240px; margin: 0 auto 20px; border-radius: 50%;
    border: 8px solid var(--bg); overflow: hidden;
    box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
  }
  .photo-container img { width: 100%; height: 100%; object-fit: cover; }
  .user-name { font-size: 26px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; color: #222; }

  /* Hidden Details Section */
  #details { 
    display: none; margin-top: 25px; text-align: left; 
    padding: 15px; background: rgba(255,255,255,0.2); border-radius: 20px; 
    animation: slideDown 0.4s ease forwards;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .kv { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 14px; }
  .kv b { color: #666; font-weight: 600; }
  .kv span { font-weight: 800; color: #000; }

  /* Icon Buttons Grid */
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
  .btn {
    background: var(--bg); border: none; border-radius: 25px; padding: 20px 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  }
  .btn img { width: 50px; height: 50px; object-fit: contain; }
  .btn span { font-size: 12px; font-weight: 700; color: #555; }
  
  .btn:active {
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    transform: scale(0.96);
  }

  /* Table Results Area */
  #res_card { display: none; text-align: left; min-height: 200px; }
  .res-header { font-weight: 800; font-size: 20px; color: #ff9f43; margin-bottom: 15px; }
  
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .tbl th { background: rgba(0,0,0,0.05); padding: 12px; text-align: left; }
  .tbl td { padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .photo-container { width: 180px; height: 180px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid">
    
    <div class="card">
      <div class="photo-container">
        <img id="u_img" src="" alt="Profile Photo">
      </div>
      <div class="user-name" id="u_name">Loading...</div>
      
      <div id="details"></div>
    </div>

    <div class="content-side">
      <div class="card">
        <div class="btns">
          <div class="btn" onclick="handleAction('leave-balance')"><img src="icons/leave-bal.png"><span>Leave Bal</span></div>
          <div class="btn" onclick="handleAction('attendance')"><img src="icons/attendance.png"><span>Attendance</span></div>
          <div class="btn" onclick="handleAction('salary')"><img src="icons/salary.png"><span>Salary</span></div>
          <div class="btn" onclick="handleAction('documents')"><img src="icons/docs.png"><span>Docs</span></div>
          <div class="btn" onclick="handleAction('complaints')"><img src="icons/status.png"><span>Status</span></div>
          <div class="btn" onclick="window.location.href='COM.HTML'"><img src="icons/apply.png"><span>Comp. Apply</span></div>
          <div class="btn" onclick="handleAction('bonus')"><img src="icons/bonus.png"><span>Bonus</span></div>
          <div class="btn" onclick="handleAction('leaves')"><img src="icons/leave-req.png"><span>Leave Status</span></div>
          <div class="btn" onclick="handleAction('holidays')"><img src="icons/holiday.png"><span>Holidays</span></div>
        </div>
      </div>

      <div class="card" id="res_card">
        <div id="res_title" class="res-header"></div>
        <div id="res_body"></div>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  function kv(l, v) { return `<div class="kv"><b>${l}</b><span>${v || '-'}</span></div>`; }

  function handleAction(key) {
    // Show components
    document.getElementById('details').style.display = 'block';
    document.getElementById('res_card').style.display = 'block';
    
    // Call existing openSection from app.js
    if(typeof openSection === "function") {
      openSection(key);
    }
  }

  async function init() {
    try {
      const d = await fetchMe();
      window.__DATA__ = d;
      const p = d.profile || {};
      
      document.getElementById('u_name').innerText = p.Name;
      const img = document.getElementById('u_img');
      img.src = `photos/${p.EmpCode}.jpg`;
      img.onerror = () => img.src = 'https://via.placeholder.com/240';

      // Load data into hidden details div
      document.getElementById('details').innerHTML = `
        ${kv('Emp ID', p.EmpCode)}
        ${kv('Designation', p.Designation)}
        ${kv('Mobile', p.Mobile)}
        ${kv('Join Date', p.JoiningDate)}
      `;
    } catch(e) { console.error(e); }
  }

  init();
</script>
</body>
</html>
