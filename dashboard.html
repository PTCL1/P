<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Dashboard | Dynamic Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root { 
    --bg: #e0e5ec; 
    --text: #333; 
    --yellow: #ffcc00; 
    --shadow-dark: #a3b1c6;
    --shadow-light: #ffffff;
  }
  
  * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
  
  .wrap { max-width: 1200px; margin: 0 auto; padding: 25px; }

  /* Top Section Layout */
  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 30px; align-items: start; }

  /* Neumorphic Card */
  .card {
    background: var(--bg);
    border-radius: 40px;
    padding: 30px;
    box-shadow: 12px 12px 20px var(--shadow-dark), -12px -12px 20px var(--shadow-light);
    text-align: center;
  }

  /* Profile Photo - Increased Size */
  .photo-container {
    width: 220px;
    height: 220px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 8px solid var(--bg);
    box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
    overflow: hidden;
  }
  .photo-container img { width: 100%; height: 100%; object-fit: cover; }

  .user-name { font-size: 28px; font-weight: 800; margin: 15px 0; letter-spacing: -0.5px; text-transform: uppercase; }

  /* Details Section - Initially Hidden */
  #details {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid rgba(0,0,0,0.05);
    display: none; /* Default Hidden */
    opacity: 0;
    transform: translateY(20px);
  }
  #details.active { display: block; opacity: 1; transform: translateY(0); }

  .kv { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid rgba(0,0,0,0.03); font-size: 14px; }
  .kv b { color: #666; }
  .kv span { font-weight: 800; color: #000; }

  /* Buttons Grid */
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  
  .btn {
    background: var(--bg); border: none; border-radius: 25px; padding: 25px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    cursor: pointer; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  }
  .btn i { font-size: 28px; color: var(--yellow); }
  .btn span { font-size: 13px; font-weight: 700; color: #555; }
  
  .btn:active {
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    transform: scale(0.95);
  }

  /* Right Side Results */
  .content-area { display: flex; flex-direction: column; gap: 25px; }
  .result-card { min-height: 200px; text-align: left; }
  .section-header { font-weight: 800; font-size: 22px; margin-bottom: 20px; color: #ff9f43; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .btns { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid">
    
    <div class="card">
      <div class="photo-container">
        <img id="photo" src="" alt="Profile Photo">
      </div>
      <div class="user-name" id="userName">Loading...</div>
      
      <div id="details"></div>
    </div>

    <div class="content-area">
      <div class="card">
        <div class="btns">
          <div class="btn" onclick="handleAction('leave-balance')"><i class="fas fa-wallet"></i><span>Leave Bal</span></div>
          <div class="btn" onclick="handleAction('attendance')"><i class="fas fa-calendar-check"></i><span>Attendance</span></div>
          <div class="btn" onclick="handleAction('salary')"><i class="fas fa-file-invoice-dollar"></i><span>Salary</span></div>
          <div class="btn" onclick="handleAction('documents')"><i class="fas fa-file-alt"></i><span>Docs</span></div>
          <div class="btn" onclick="handleAction('complaints')"><i class="fas fa-history"></i><span>Comp. Status</span></div>
          <div class="btn" onclick="handleAction('holidays')"><i class="fas fa-umbrella-beach"></i><span>Holidays</span></div>
        </div>
      </div>

      <div class="card result-card" id="resultCard" style="display:none;">
        <div id="sectionTitle" class="section-header"></div>
        <div id="sectionBody"></div>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  function kv(label, value) { 
    return `<div class="kv"><b>${label}</b><span>${value || '-'}</span></div>`; 
  }

  // Common Function for Toggle and Data
  function handleAction(key) {
    // 1. Show Details Section under Profile
    const detailsDiv = document.getElementById('details');
    detailsDiv.classList.add('active');
    detailsDiv.style.display = 'block';

    // 2. Show Result Card on Right
    document.getElementById('resultCard').style.display = 'block';

    // 3. Call your existing data loading function
    if(typeof openSection === "function") {
        openSection(key);
    }
  }

  async function init() {
    try {
      const d = await fetchMe(); // aapka api call
      window.__DATA__ = d;
      const p = d.profile || {};
      
      // Set Large Photo & Name
      document.getElementById('userName').textContent = p.Name;
      const img = document.getElementById('photo');
      img.src = `photos/${p.EmpCode}.jpg`;
      img.onerror = () => img.src = 'https://via.placeholder.com/220';

      // Prepare details (hidden initially)
      document.getElementById('details').innerHTML = `
        ${kv('Emp ID', p.EmpCode)}
        ${kv('Designation', p.Designation)}
        ${kv('Mobile', p.Mobile)}
        ${kv('PF Number', p.PFNumber)}
        ${kv('Joining Date', p.JoiningDate)}
      `;

    } catch (e) { console.error(e); }
  }

  init();
</script>
</body>
</html>
