<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Form | PTCL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #e0e5ec; 
      --text: #333; 
      --red-accent: #e74c3c; 
      --shadow-dark: #a3b1c6;
      --shadow-light: #ffffff;
      --danger: #e74c3c;
      --success: #27ae60;
    }

    * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
    
    body { 
      margin: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }

    /* Neumorphic Container */
    .container { 
      width: min(450px, 100%); 
      background: var(--bg); 
      border-radius: 40px; 
      padding: 40px 30px; 
      box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    h2 { 
      font-size: 22px; 
      font-weight: 800; 
      margin-bottom: 30px; 
      color: #222; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      border-bottom: 3px solid var(--red-accent);
      display: inline-block;
      padding-bottom: 5px;
    }

    .form-group { text-align: left; margin-bottom: 18px; }
    
    label { 
      display: block; 
      font-size: 11px; 
      font-weight: 800; 
      color: #777; 
      margin-left: 15px; 
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* Neumorphic Inputs & Textarea */
    input, textarea { 
      width: 100%; 
      padding: 14px 20px; 
      background: var(--bg); 
      border: none; 
      border-radius: 15px; 
      outline: none; 
      color: #444;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    }

    input:read-only { color: #888; cursor: not-allowed; }

    input:focus:not(:read-only), textarea:focus {
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
      border-left: 3px solid var(--red-accent);
    }

    textarea { resize: none; height: 100px; }

    /* Buttons Style */
    .btn-group { display: flex; gap: 15px; margin-top: 25px; }

    button { 
      flex: 1;
      padding: 15px; 
      border-radius: 15px; 
      border: none;
      background: var(--bg);
      font-weight: 800; 
      font-size: 14px; 
      cursor: pointer; 
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #submitBtn { color: var(--red-accent); }
    .close-btn { color: #555; }

    button:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      transform: scale(0.98);
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status { 
      margin-top: 20px; 
      font-size: 13px; 
      font-weight: 700;
      min-height: 1.2em;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }
    .status.success { color: var(--success); display: block; }
    .status.error { color: var(--danger); display: block; }
    .status.info { color: #555; display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Complaint Form</h2>

    <form id="complaintForm">
      <div class="form-group">
        <label>Employee Name</label>
        <input type="text" id="empName" readonly>
      </div>

      <div class="form-group">
        <label>Current Date</label>
        <input type="date" id="date" readonly required>
      </div>

      <div class="form-group">
        <label>Against Person / Subject</label>
        <input type="text" id="againstPerson" placeholder="Enter Name or Topic" required>
      </div>

      <div class="form-group">
        <label>Complaint Details</label>
        <textarea id="complaint" placeholder="Type your complaint here..." required></textarea>
      </div>

      <div class="btn-group">
        <button id="submitBtn" type="button" onclick="submitComplaint()">Submit</button>
        <button type="button" class="close-btn" onclick="goBack()">Close</button>
      </div>
    </form>

    <div class="status" id="statusMsg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function todayISO() {
      return new Date().toISOString().split("T")[0];
    }

    window.onload = function () {
      document.getElementById("date").value = todayISO();
      document.getElementById("empName").value = localStorage.getItem('ep_name') || 'Employee';

      if (!localStorage.getItem('ep_token')) {
        alert('Please login again.');
        window.location.href = 'index.html';
      }
    };

    async function submitComplaint() {
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      const date = document.getElementById("date").value || todayISO();
      const againstPerson = document.getElementById("againstPerson").value.trim();
      const complaint = document.getElementById("complaint").value.trim();

      if(!againstPerson || !complaint) {
          statusMsg.textContent = "Please fill all fields.";
          statusMsg.className = "status error";
          return;
      }

      statusMsg.style.display = "block";
      statusMsg.className = "status info";
      statusMsg.textContent = "Saving your complaint...";
      btn.disabled = true;

      try {
        await applyComplaint({ date, againstPerson, complaint });

        statusMsg.textContent = "Submitted successfully!";
        statusMsg.className = "status success";

        document.getElementById("complaintForm").reset();
        document.getElementById("date").value = todayISO();
        document.getElementById("empName").value = localStorage.getItem('ep_name') || '';
      } catch (err) {
        statusMsg.textContent = "Error: " + (err.message || "Failed to save");
        statusMsg.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
