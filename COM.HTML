<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #FFD700;
    }
    .container {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
      width: 420px;
      animation: fadeIn 0.6s ease-in-out;
    }
    h2 { text-align: center; color: #FFD700; margin-bottom: 20px; font-size: 22px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #FFD700; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #FFD700;
      border-radius: 8px;
      outline: none;
      background: #000;
      color: #FFD700;
      transition: 0.3s;
    }
    input:focus, textarea:focus { border-color: #FFA500; box-shadow: 0 0 8px #FFD700; }
    textarea { resize: none; height: 80px; }
    button {
      width: 100%;
      padding: 12px;
      background: #FFD700;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    button:hover { background: #FFA500; color: #fff; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .close-btn { background: #FF4500; color: #fff; }
    .close-btn:hover { background: #FF0000; }
    .status { text-align: center; margin-top: 15px; font-weight: 500; display: none; }
    .status.success { color: #00FF00; }
    .status.error { color: #FF6347; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <h2>Complaint Form</h2>

    <form id="complaintForm">
      <label>Employee Name:</label>
      <input type="text" id="empName" readonly>

      <label>Date:</label>
      <input type="date" id="date" readonly required>

      <label>Against Person / Subject:</label>
      <input type="text" id="againstPerson" required>

      <label>What's Complaint:</label>
      <textarea id="complaint" required></textarea>

      <button id="submitBtn" type="button" onclick="submitComplaint()">Submit</button>
      <button type="button" class="close-btn" onclick="goBack()">Close</button>
    </form>

    <div class="status" id="statusMsg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function todayISO() {
      return new Date().toISOString().split("T")[0];
    }

    window.onload = async function () {
      document.getElementById("date").value = todayISO();

      // Name from localStorage (set during login)
      const name = localStorage.getItem('ep_name') || '';
      document.getElementById("empName").value = name;

      // If token missing, go login
      if (!localStorage.getItem('ep_token')) {
        alert('Please login again.');
        window.location.href = 'index.html';
        return;
      }
    };

    async function submitComplaint() {
      const statusMsg = document.getElementById("statusMsg");
      const btn = document.getElementById("submitBtn");

      const date = document.getElementById("date").value || todayISO();
      const againstPerson = document.getElementById("againstPerson").value.trim();
      const complaint = document.getElementById("complaint").value.trim();

      statusMsg.style.display = "block";
      statusMsg.className = "status";
      statusMsg.textContent = "Please wait, your complaint is being saved...";
      btn.disabled = true;

      try {
        await applyComplaint({ date, againstPerson, complaint });

        statusMsg.textContent = "Complaint submitted successfully!";
        statusMsg.className = "status success";

        document.getElementById("complaintForm").reset();
        document.getElementById("date").value = todayISO();
        document.getElementById("empName").value = localStorage.getItem('ep_name') || '';
      } catch (err) {
        statusMsg.textContent = "Error: " + (err.message || String(err));
        statusMsg.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
